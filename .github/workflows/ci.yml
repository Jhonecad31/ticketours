name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17.12-alpine3.23
        env:
          POSTGRES_USER: ticketours
          POSTGRES_PASSWORD: ticketours_ci
          POSTGRES_DB: ticketours_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticketours -d ticketours_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: ticketours_test
      DB_USERNAME: ticketours
      DB_PASSWORD: ticketours_ci
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_pgsql
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpunit

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
