        "201": {"description":"Operación completada","headers":*correlationHeaders,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/Resource"}}}}
        "400": *error400
        "401": *error401
        "403": *error403
        "404": *error404
        "409": *error409
        "419": *error419
        "422": *error422
