openapi: "3.0.3"
info: {"title":"Ticketours API","version":"0.7.0","description":"Fases 1 a 6 activas. Incluye boletos QR, check-in en línea, conciliación, liquidaciones simuladas, reportes y webhooks locales firmados."}
servers: [{"url":"/api/v1"}]
security: [{"sessionCookie":[]}]
