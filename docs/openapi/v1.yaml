    parameters: [{"name":"org","in":"path","required":true,"schema":{"type":"string","minLength":1,"maxLength":128}}]
    post:
      operationId: "createReservation"
      summary: "Crear reserva retenida"
      x-permission: "reservations.create"
      parameters: [{"$ref":"#/components/parameters/IdempotencyKey"},{"$ref":"#/components/parameters/CsrfToken"}]
      requestBody: {"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ReservationInput"},"example":{"hold_id":"hold_01","customer_id":"customer_01","participants":[{"name":"Cliente de prueba"}]}}}}
      description: "Crea una reserva retenida a partir de una retención activa. Registra una instantánea de precio y política."
      responses:
        "201": {"description":"Recurso creado","headers":*correlationHeaders,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/Reservation"}}}}
        "400": *error400
        "401": *error401
        "403": *error403
        "404": *error404
        "409": *error409
        "422": *error422
        "429": *error429
        "419": *error419
        "500": *error500
