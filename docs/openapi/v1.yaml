        "403": *error403
        "404": *error404
        "409": *error409
        "422": *error422
        "419": *error419
        "429": *error429
        "500": *error500
  /organizations/{org}/availability:
    parameters: [{"name":"org","in":"path","required":true,"schema":{"type":"string","minLength":1,"maxLength":128}}]
    get:
      operationId: "getAvailability"
      description: "Solo variantes publicadas. Ventana de consulta hasta 93 días, extremos [inicio, fin). Incluye sesiones completas futuras o ventanas de recursos recortadas al intervalo y descontando bloqueos. La consulta no compromete inventario. Descuenta retenciones vigentes y reservas confirmadas. Para recursos también descuenta bloqueos administrativos."
      summary: "Consultar disponibilidad observada"
      x-permission: "inventory.read"
      parameters: [{"name":"variant_id","in":"query","required":true,"schema":{"type":"string","minLength":1,"maxLength":128}},{"name":"from","in":"query","required":true,"schema":{"type":"string","format":"date-time","description":"Fecha RFC 3339 con desplazamiento explícito. Las respuestas usan UTC."}},{"name":"to","in":"query","required":true,"schema":{"type":"string","format":"date-time","description":"Fecha RFC 3339 con desplazamiento explícito. Las respuestas usan UTC."}},{"name":"resource_id","in":"query","required":false,"schema":{"type":"string","minLength":1,"maxLength":128},"description":"Filtro para modalidad de recurso exclusivo"}]
      responses:
        "200": {"description":"Operación completada","headers":*correlationHeaders,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/Availability"},"example":{"variant_id":"variant_01","time_zone":"America/Cancun","items":[{"session_id":"session_01","start_at":"2027-01-12T15:00:00Z","end_at":"2027-01-12T16:00:00Z","available_quantity":2}]}}}}
        "400": *error400
        "401": *error401
        "403": *error403
        "404": *error404
        "422": *error422
        "429": *error429
        "500": *error500
  /organizations/{org}/quotes:
    parameters: [{"name":"org","in":"path","required":true,"schema":{"type":"string","minLength":1,"maxLength":128}}]
    post:
      operationId: "createQuote"
      summary: "Cotizar una selección"
      description: "Cotiza una selección futura con tarifa base y política vigentes. Una sesión multiplica cantidad por tarifa. Un recurso usa tarifa fija por intervalo."
      x-permission: "reservations.quote"
      requestBody: {"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/QuoteInput"},"example":{"variant_id":"variant_01","selection":{"session_id":"session_01","quantity":2}}}}}
      parameters: [{"$ref":"#/components/parameters/CsrfToken"}]
      responses:
        "201": {"description":"Recurso creado","headers":*correlationHeaders,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/Quote"}}}}
        "400": *error400
        "401": *error401
        "403": *error403
        "404": *error404
        "409": *error409
        "422": *error422
        "429": *error429
        "419": *error419
        "500": *error500
  /organizations/{org}/holds:
    parameters: [{"name":"org","in":"path","required":true,"schema":{"type":"string","minLength":1,"maxLength":128}}]
    post:
      operationId: "createHold"
      summary: "Retener inventario"
      description: "Valida inventario y cotización, que se usa una sola vez. La vigencia se calcula al crear la retención y se limita al inicio del servicio."
      x-permission: "reservations.hold"
      parameters: [{"$ref":"#/components/parameters/IdempotencyKey"},{"$ref":"#/components/parameters/CsrfToken"}]
      requestBody: {"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/HoldInput"},"example":{"quote_id":"quote_01","selection":{"session_id":"session_01","quantity":2}}}}}
      responses:
        "201": {"description":"Recurso creado","headers":*correlationHeaders,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/Hold"}}}}
        "400": *error400
        "401": *error401
        "403": *error403
        "404": *error404
        "409": *error409
        "422": *error422
        "429": *error429
        "419": *error419
        "500": *error500
