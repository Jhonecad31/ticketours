      operationId: "getCsrfToken"
      summary: "Inicializar o consultar el token CSRF de la sesión"
      security: []
      responses:
        "200": {"description":"Token de sesión", "headers":{"Set-Cookie":{"description":"Cookie ticketours_session HttpOnly. Secure en HTTPS.","schema":{"type":"string"}},"X-Correlation-ID":{"schema":{"type":"string"}}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/CsrfToken"}}}}
